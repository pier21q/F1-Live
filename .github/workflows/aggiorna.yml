# Aggiorna il sito di F1 Live sui computer di GitHub, anche con il Mac spento.
# Riscarica le fonti (Jolpica, OpenF1, Open-Meteo), ricalcola statistiche e pronostici, ripubblica il sito nel
# ramo "sito" e salva i dati nel ramo "dati".
# Ritmo: ogni 30 minuti; nei weekend di gara, dall'inizio delle libere a un'ora dopo la fine di ogni sessione,
# ogni 15 minuti (OpenF1 pubblica i dati di una sessione pochi minuti dopo la fine).
# GitHub salta molte esecuzioni programmate: per questo parte ogni 15 minuti e decide da solo se serve.
# Il file originale sta nella cartella dell'app sul Mac (cloud/aggiorna.yml): lo carica "python sito.py codice".
name: Aggiorna F1 Live

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      auto:
        description: "Avvio programmato esterno: aggiorna solo se è l'ora"
        required: false
        default: ""
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

concurrency:
  group: aggiorna
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Europe/Rome
      F1LIVE_DATA_DIR: ${{ github.workspace }}/dati
      F1LIVE_SITE_DIR: ${{ github.workspace }}/sito
    steps:
      - name: Dati salvati
        uses: actions/checkout@v7
        with:
          ref: dati
          path: dati
      - name: Serve un aggiornamento?
        id: serve
        env:
          AUTO: ${{ github.event.inputs.auto }}
        run: |
          python3 - <<'PY'
          import json, os, time
          now = time.time()
          try:
              e = json.load(open("dati/esecuzione.json"))
          except Exception:
              e = {}
          at = e.get("at", 0)
          # nelle ore delle sessioni (e fino a un'ora dopo) si aggiorna ogni 15 minuti, altrimenti ogni 30
          weekend = any(a - 1800 <= now <= b + 3600 for a, b in e.get("prossimo") or [])
          timed = os.environ["GITHUB_EVENT_NAME"] == "schedule" or bool(os.environ.get("AUTO"))
          due = not timed or now - at >= 25 * 60 or (weekend and now - at >= 10 * 60)
          print(f"Ultimo aggiornamento {int((now - at) // 60)} minuti fa" + (", sessione in corso" if weekend else "")
                + (": si aggiorna" if due else ": niente da fare"))
          open(os.environ["GITHUB_OUTPUT"], "a").write(f"ok={'true' if due else 'false'}\n")
          PY
      - name: Codice dell'app
        if: steps.serve.outputs.ok == 'true'
        uses: actions/checkout@v7
        with:
          path: app
      - name: Sito
        if: steps.serve.outputs.ok == 'true'
        uses: actions/checkout@v7
        with:
          ref: sito
          path: sito
      - name: Python
        if: steps.serve.outputs.ok == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - name: Componenti
        if: steps.serve.outputs.ok == 'true'
        run: pip install -r app/requirements.txt
      - name: Aggiorna dati e sito
        if: steps.serve.outputs.ok == 'true'
        run: |
          git config --global user.name "F1 Live"
          git config --global user.email "f1-live@users.noreply.github.com"
          python -u app/server.py --cloud
      - name: Tieni attiva la programmazione
        # GitHub sospende le programmazioni dei repository fermi da 60 giorni: una volta al giorno la riattiva
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date +%H)" = "03" ]; then gh api -X PUT "repos/${{ github.repository }}/actions/workflows/aggiorna.yml/enable"; fi
